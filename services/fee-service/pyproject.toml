[tool.poetry]
name = "fee-service"
version = "0.1.0"
description = "Transfer fee calculation service"
authors = ["TransferX Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.125.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
pydantic = ">=1.10.13,<3"
requests = "2.32.5"
urllib3 = "2.6.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[tool.poetry.scripts]
fee-service = "fee_service.main:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
