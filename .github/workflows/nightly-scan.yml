name: Nightly Security Scan

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/transferx

jobs:
  scan-published-images:
    name: Scan Published Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - kyc-service
          - fee-service
          - sanctions-service
          - swift-gateway
          - crypto-transfer
          - audit-service
          - web-portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        id: pull
        continue-on-error: true
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"

      - name: Run Trivy vulnerability scanner
        if: steps.pull.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to GitHub Security
        if: steps.pull.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: "nightly-scan-${{ matrix.service }}"

      - name: Run Grype vulnerability scanner
        if: steps.pull.outcome == 'success'
        uses: anchore/scan-action@v7
        id: grype
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest'
          fail-build: false
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security
        if: steps.pull.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: "nightly-grype-${{ matrix.service }}"

  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: scan-published-images
    if: always()
    permissions:
      contents: read
      packages: read

    steps:
      - name: Generate summary report
        run: |
          echo "## 🔒 Nightly Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scanned Services" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| api-gateway | Go | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| kyc-service | .NET | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| fee-service | Python | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| sanctions-service | Java | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| swift-gateway | COBOL | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| crypto-transfer | Rust | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| audit-service | Perl | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "| web-portal | Next.js | Scanned |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the **Security** tab → **Code scanning alerts**" >> $GITHUB_STEP_SUMMARY

