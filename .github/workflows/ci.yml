name: CI/CD - Build, Test & Publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/transferx

jobs:
  build:
    name: Build Services
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build all services
        run: nix build .#all-services --print-out-paths

      - name: Build all Docker images
        run: nix build .#all-images --print-out-paths

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: result/
          retention-days: 1

  generate-sboms:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    
    outputs:
      services: ${{ steps.set-services.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: images/

      - name: Load Docker images
        run: |
          for img in images/*.tar.gz; do
            echo "Loading $(basename $img)..."
            docker load < "$img"
          done
          docker images | grep transferx

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set services list
        id: set-services
        run: |
          echo 'services=["api-gateway","kyc-service","fee-service","sanctions-service","swift-gateway","crypto-transfer","audit-service","web-portal"]' >> $GITHUB_OUTPUT

      - name: Generate SBOMs
        run: |
          mkdir -p sboms
          SERVICES="api-gateway kyc-service fee-service sanctions-service swift-gateway crypto-transfer audit-service web-portal"
          for service in $SERVICES; do
            echo "Generating SBOM for $service..."
            syft "transferx/$service:latest" -o cyclonedx-json --file "sboms/$service.cdx.json"
            syft "transferx/$service:latest" -o spdx-json --file "sboms/$service.spdx.json"
          done

      - name: Upload SBOMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sboms/
          retention-days: 30

  publish-sboms:
    name: Publish SBOMs to GitHub Security
    runs-on: ubuntu-latest
    needs: generate-sboms
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      security-events: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sboms/

      - name: Submit SBOM to GitHub Dependency Graph
        uses: advanced-security/spdx-dependency-submission-action@v0.1.1
        with:
          filePath: "sboms/${{ matrix.service }}.spdx.json"

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: generate-sboms
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sboms/

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v5
        id: scan
        with:
          sbom: "sboms/${{ matrix.service }}.cdx.json"
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: "vulnerability-scan-${{ matrix.service }}"

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build, generate-sboms]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: images/

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sboms/

      - name: Load Docker image
        run: docker load < "images/${{ matrix.service }}.tar.gz"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag and push image
        id: push
        run: |
          SOURCE_IMAGE="transferx/${{ matrix.service }}:latest"
          
          # Tag with all metadata tags
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "Tagging $SOURCE_IMAGE as $tag"
            docker tag "$SOURCE_IMAGE" "$tag"
            docker push "$tag"
          done
          
          # Get the digest of the pushed image
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest" 2>/dev/null | cut -d'@' -f2 || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@v2
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sboms/${{ matrix.service }}.spdx.json
          push-to-registry: true

  release-sboms:
    name: Attach SBOMs to Release
    runs-on: ubuntu-latest
    needs: [generate-sboms, publish-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sboms/

      - name: Create SBOM archive
        run: |
          cd sboms
          zip -r ../transferx-sboms-${{ github.ref_name }}.zip *.cdx.json *.spdx.json

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transferx-sboms-${{ github.ref_name }}.zip
            sboms/*.cdx.json
            sboms/*.spdx.json

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, generate-sboms, vulnerability-scan, publish-images]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 TransferX CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Services | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate SBOMs | ${{ needs.generate-sboms.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerability Scan | ${{ needs.vulnerability-scan.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish Images | ${{ needs.publish-images.result == 'success' && '✅ Success' || needs.publish-images.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- api-gateway (Go)" >> $GITHUB_STEP_SUMMARY
          echo "- kyc-service (.NET)" >> $GITHUB_STEP_SUMMARY
          echo "- fee-service (Python)" >> $GITHUB_STEP_SUMMARY
          echo "- sanctions-service (Java)" >> $GITHUB_STEP_SUMMARY
          echo "- swift-gateway (COBOL)" >> $GITHUB_STEP_SUMMARY
          echo "- crypto-transfer (Rust)" >> $GITHUB_STEP_SUMMARY
          echo "- audit-service (Perl)" >> $GITHUB_STEP_SUMMARY
          echo "- web-portal (Next.js)" >> $GITHUB_STEP_SUMMARY

