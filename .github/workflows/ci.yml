name: CI/CD - Build, Test & Publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/transferx

jobs:
  update-nix-hashes:
    name: Update Nix Hashes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    env:
      FLAKEHUB_PUBLISH: "0"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Need full history for git diff

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update Nix hashes
        id: update-hashes
        continue-on-error: true
        run: |
          chmod +x scripts/update-nix-hashes.sh
          scripts/update-nix-hashes.sh || true

      - name: Check for changes and prepare PR comment data
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
            
            # Capture updated files
            UPDATED_FILES=$(git diff --name-only release/ | grep -E '\.(nix|gemset\.nix)$' || true)
            echo "updated_files<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            # Extract service names from file paths
            SERVICES=$(echo "$UPDATED_FILES" | sed -E 's|release/([^-]+).*|\1|' | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "updated_services<<EOF" >> $GITHUB_OUTPUT
            echo "$SERVICES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            # Capture a summary of the diff (just the changed lines, not full diff)
            DIFF_SUMMARY=$(git diff release/ | grep -E '^[+-].*sha256|^[+-].*hash|^[+-].*vendorHash|^[+-].*npmDepsHash|^[+-].*outputHash' | head -20 || echo "Hash changes detected")
            echo "diff_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$DIFF_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push hash updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git add release/*.nix release/*-deps.nix release/*-gemset.nix || true
          git commit -m "chore: update Nix hashes for dependency changes

          Auto-updated by CI to fix hash mismatches after dependency updates." || exit 0
          git push origin HEAD:${{ github.head_ref }} || git push

      - name: Comment on PR with details
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const updatedFiles = `${{ steps.check-changes.outputs.updated_files }}`.trim().split('\n').filter(f => f);
            const updatedServices = `${{ steps.check-changes.outputs.updated_services }}`.trim();
            const diffSummary = `${{ steps.check-changes.outputs.diff_summary }}`.trim();
            
            // Create a detailed comment
            let servicesList = '';
            if (updatedServices) {
              const services = updatedServices.split(',').filter(s => s);
              servicesList = services.map(s => '- `' + s + '`').join('\n');
            } else if (updatedFiles.length > 0) {
              const services = updatedFiles.map(f => {
                const match = f.match(/release\/([^-]+)/);
                return match ? match[1] : null;
              }).filter(s => s);
              servicesList = [...new Set(services)].map(s => '- `' + s + '`').join('\n');
            }
            
            const filesList = updatedFiles.length > 0 
              ? updatedFiles.map(f => '- `' + f + '`').join('\n')
              : 'Unable to determine which files were updated.';
            
            let comment = '## ⚠️ Nix Hashes Updated Automatically\n\n';
            comment += 'I\'ve automatically updated Nix dependency hashes to match the updated dependencies in this PR.\n\n';
            comment += '### 📋 Updated Services\n\n';
            comment += (servicesList || 'Unable to determine which services were updated. Please check the commit changes.') + '\n\n';
            comment += '### ⚠️ **IMPORTANT: Please Verify These Changes**\n\n';
            comment += '**Before merging, please verify that these hash updates are expected and correct:**\n\n';
            comment += '1. **Review the dependency changes**: Check that the dependency updates in this PR are legitimate and expected.\n';
            comment += '2. **Verify the hash changes**: Review the commit diff to ensure only hash values changed, not the structure of the Nix files.\n';
            comment += '3. **Check the build**: The CI build should now pass. If it doesn\'t, there may be an issue with the hash update process.\n\n';
            comment += '### 🔍 How to Verify the Changes\n\n';
            comment += '```bash\n';
            comment += '# 1. Review the diff to see what changed\n';
            comment += 'git diff HEAD~1 release/\n\n';
            comment += '# 2. Verify the service builds locally (if you have Nix installed)\n';
            comment += 'nix build .#<service-name>\n\n';
            comment += '# 3. Check that only hash values changed, not file structure\n';
            comment += 'git diff HEAD~1 release/ | grep -E \'^[+-].*sha256|^[+-].*hash\'\n';
            comment += '```\n\n';
            comment += '### 📝 What Changed\n\n';
            comment += 'The following files were updated:\n';
            comment += filesList + '\n\n';
            
            if (diffSummary) {
              comment += '### 🔍 Hash Change Summary\n\n';
              comment += '```\n';
              comment += diffSummary + '\n';
              comment += '```\n\n';
            }
            
            comment += '### 🔄 Next Steps\n\n';
            comment += '- The build will automatically re-run with the updated hashes\n';
            comment += '- If the build passes, you can merge this PR\n';
            comment += '- If you see any unexpected changes, please review and revert if necessary\n\n';
            comment += '---\n\n';
            comment += '*This comment was automatically generated by the CI workflow.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: [update-nix-hashes]
    if: always() && (needs.update-nix-hashes.result == 'success' || needs.update-nix-hashes.result == 'skipped')
    permissions:
      contents: read
    env:
      # Explicitly disable FlakeHub registration
      FLAKEHUB_PUBLISH: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # May need full history if hashes were updated

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build all services
        run: nix build .#all-services --print-out-paths

      - name: Build all Docker images
        run: nix build .#all-images --print-out-paths

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-images
          path: result/
          retention-days: 1

  generate-sboms:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    
    outputs:
      services: ${{ steps.set-services.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Download Docker images
        uses: actions/download-artifact@v7
        with:
          name: docker-images
          path: images/

      - name: Load Docker images
        run: |
          for img in images/*.tar.gz; do
            echo "Loading $(basename $img)..."
            docker load < "$img"
          done
          docker images | grep transferx

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set services list
        id: set-services
        run: |
          # Get services from service registry
          SERVICES_JSON=$(nix eval --json .#serviceRegistry.serviceNamesJson)
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          # Also set as space-separated for shell loops (trim trailing space)
          SERVICES_LIST=$(nix eval --raw .#serviceRegistry.serviceList)
          echo "services_list=$SERVICES_LIST" >> $GITHUB_OUTPUT

      - name: Generate SBOMs
        run: |
          mkdir -p sboms
          SERVICES='${{ steps.set-services.outputs.services_list }}'

          # Generate canonical CycloneDX SBOMs using Nix (base/runtime/app/container via compositions)
          # This generates:
          # - base.cdx.json: Base system components
          # - runtime-*.cdx.json: Language runtime environments
          # - app-*.cdx.json: Application-specific dependencies (includes npm deps for Node.js services)
          # - container-*.cdx.json: Complete container SBOMs (base + runtime + app)
          # This approach captures both Nix store dependencies and npm/Python/etc. dependencies
          echo "Generating Nix-based CycloneDX SBOMs..."
          nix run .#generate-composed-sboms -- sboms

          # Generate SPDX SBOMs from container images for GitHub Dependency Graph
          # GitHub Dependency Graph requires SPDX format and expects SBOMs generated from artifacts
          # The SPDX SBOMs contain the same dependencies as container-*.cdx.json but in SPDX format
          echo "Generating SPDX SBOMs from container images for GitHub Dependency Graph..."
          for service in $SERVICES; do
            echo "Generating SPDX SBOM for $service from container image..."
            syft "transferx/$service:latest" -o spdx-json --file "sboms/$service.spdx.json"
          done

      - name: Upload SBOMs artifact
        uses: actions/upload-artifact@v6
        with:
          name: sboms
          path: sboms/
          retention-days: 30

  publish-sboms:
    name: Publish SBOMs to GitHub Security
    runs-on: ubuntu-latest
    needs: generate-sboms
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      security-events: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download SBOMs
        uses: actions/download-artifact@v7
        with:
          name: sboms
          path: sboms/

      - name: Submit Container SBOM to GitHub Dependency Graph
        uses: advanced-security/spdx-dependency-submission-action@v0.1.2
        with:
          # Use the SPDX SBOM generated from the container image
          # This corresponds to our container-{service}.cdx.json CycloneDX SBOM
          # The SPDX SBOM contains the same dependencies as the container CycloneDX SBOM
          filePath: "sboms/${{ matrix.service }}.spdx.json"

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: generate-sboms
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download SBOMs
        uses: actions/download-artifact@v7
        with:
          name: sboms
          path: sboms/

      - name: Run Grype vulnerability scan
        uses: anchore/scan-action@v7
        id: scan
        with:
          sbom: "sboms/container-${{ matrix.service }}.cdx.json"
          fail-build: false
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: "vulnerability-scan-${{ matrix.service }}"

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build, generate-sboms]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.generate-sboms.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Docker images
        uses: actions/download-artifact@v7
        with:
          name: docker-images
          path: images/

      - name: Download SBOMs
        uses: actions/download-artifact@v7
        with:
          name: sboms
          path: sboms/

      - name: Load Docker image
        run: docker load < "images/${{ matrix.service }}.tar.gz"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag and push image
        id: push
        run: |
          SOURCE_IMAGE="transferx/${{ matrix.service }}:latest"
          
          # Tag with all metadata tags (handle newline-separated tags)
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Tagging $SOURCE_IMAGE as $tag"
              docker tag "$SOURCE_IMAGE" "$tag"
              docker push "$tag"
            fi
          done
          
          # Get the digest of the pushed image
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest" 2>/dev/null | cut -d'@' -f2 || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@v3
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Use the SPDX SBOM that corresponds to our container CycloneDX SBOM
          sbom-path: sboms/${{ matrix.service }}.spdx.json
          push-to-registry: true

  release-sboms:
    name: Attach SBOMs to Release
    runs-on: ubuntu-latest
    needs: [generate-sboms, publish-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download SBOMs
        uses: actions/download-artifact@v7
        with:
          name: sboms
          path: sboms/

      - name: Create SBOM archive
        run: |
          cd sboms
          # Include all SBOM types:
          # - container-*.cdx.json: Complete container SBOMs (base + runtime + app)
          # - app-*.cdx.json: Application-specific SBOMs
          # - runtime-*.cdx.json: Runtime environment SBOMs
          # - base.cdx.json: Base system SBOM
          # - *.spdx.json: SPDX format for GitHub Dependency Graph
          zip -r ../transferx-sboms-${{ github.ref_name }}.zip *.cdx.json *.spdx.json

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transferx-sboms-${{ github.ref_name }}.zip
            sboms/*.cdx.json
            sboms/*.spdx.json

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, generate-sboms, vulnerability-scan, publish-images]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 TransferX CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Services | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate SBOMs | ${{ needs.generate-sboms.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerability Scan | ${{ needs.vulnerability-scan.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish Images | ${{ needs.publish-images.result == 'success' && '✅ Success' || needs.publish-images.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- api-gateway (Go)" >> $GITHUB_STEP_SUMMARY
          echo "- kyc-service (.NET)" >> $GITHUB_STEP_SUMMARY
          echo "- fee-service (Python)" >> $GITHUB_STEP_SUMMARY
          echo "- sanctions-service (Java)" >> $GITHUB_STEP_SUMMARY
          echo "- swift-gateway (COBOL)" >> $GITHUB_STEP_SUMMARY
          echo "- crypto-transfer (Rust)" >> $GITHUB_STEP_SUMMARY
          echo "- audit-service (Perl)" >> $GITHUB_STEP_SUMMARY
          echo "- web-portal (Next.js)" >> $GITHUB_STEP_SUMMARY
          echo "- smoke-tests (Ruby/Cucumber)" >> $GITHUB_STEP_SUMMARY

